    Rhode Island Authorization for Release of Educational Records and Appointment of Guardian
  short title: |-
    RI Educational Guardian
  description: |-
    This form allows you to designate a caregiver to access your child's educational records and make decisions on their behalf. It's essential for ensuring your child's educational needs are met if you are unable to care for them.
  can_I_use_this_form: |
    You can use this form if you need to appoint someone to handle educational matters for your child. This is especially useful if you might be unavailable due to detention or other reasons.
  before_you_start: |
    ### Before you get started
    - Gather your child's information, including their names and dates of birth.
    - Identify a trusted caregiver who will act on your behalf.

    ### When you are finished
    - We strongly recommend signing in front of a notary public.
    - Keep a copy of the signed document for your records.
  when_you_are_finished: |
    After completing the form, make sure to keep a signed copy for yourself and provide a copy to the appointed caregiver. This will help ensure they can act on your behalf when needed.

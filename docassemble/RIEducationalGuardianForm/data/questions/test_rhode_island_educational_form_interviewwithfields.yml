id: Test rhode island educational form interview with fields intro
continue button field: test_rhode_island_educational_form_interviewwithfields_intro
question: Authorization for Appointment of Educational Guardian
subquestion: |
  Use this form to let a trusted adult (a {caregiver}):

  - Get your child's school records
  - Make school-related decisions if you are unavailable

  This does not make the caregiver your child's {legal guardian}.

  ## You can use this form if

  - You are the parent or legal guardian of a child in school
  - Your child lives in Rhode Island

  ## Before you start

  Have this information ready:

  - Caregiver's full name and address
  - Each child's full name
  - Each child's date of birth
  - Each child's school district

  Time: about 10 minutes

  ## Signing this form

  You will choose how to sign at the end.

  A {notary} is not required for most school districts, but we recommend having the form notarized. A notarized form may be easier for a school to accept and can help confirm that the signature is yours.

  Need a notary? You may be able to find one for free at:

  - Your public library
  - Your bank
  - United Way's 2-1-1 helpline
---
terms:
  green words: |
    Tap any green word to see what it means.
  notary: |
    A notary (notary public) is a person licensed by the state to witness signatures. Many banks and public libraries have one, often for free.
  caregiver: |
    The trusted adult you are choosing to make school decisions for your child when you are not available.
  legal guardian: |
    A person a court has given the legal right to make decisions for a child. Only a court can make someone a legal guardian. This form does not do that.
---
id: welcome screen
question: |
  ${ interview_short_title }
subquestion: |
  This tool helps you fill out Rhode Island's Educational Guardian form in 3 steps:

  Step 1. Answer questions that will fill in your form for you.<br>
  Step 2. Preview the completed form.<br>
  Step 3. Download and print the final form. You will need to deliver it on your own.

  This site is not a lawyer. If you would like a lawyer, find [your local legal aid provider](https://www.lsc.gov/what-legal-aid/find-legal-aid).

  Tap the {green words} in any screen for a definition or more information.
fields:
  - note: |
      ${ display_template(al_terms_of_use, scrollable=True) }
      To continue, you must accept our terms of use
  - I accept the terms of use: acknowledged_information_use
    datatype: yesnowide
    grid: 8
validation code: |
  if not acknowledged_information_use:
    validation_error("You must accept the terms of use to continue.")
continue button field: al_intro_screen
---
id: how many parents
question: How many parents or legal guardians will sign this form?
subquestion: The form has room for one or two parents/legal guardians.
fields:
  - no label: users.target_number
    datatype: radio
    choices:
      - 1
      - 2
---
id: caregiver address
sets:
  - "caregivers[i].address.address"
  - "caregivers[i].address.city"
  - "caregivers[i].address.zip"
  - "caregivers[i].address.unit"
  - "caregivers[i].address.state"
  - "caregivers[i].address.country"
question: "What is the caregiver's address?"
fields:
  - code: |
      caregivers[i].address_fields(country_code=AL_DEFAULT_COUNTRY, default_state=AL_DEFAULT_STATE, required={'zip': True})
---
id: user address
sets:
  - "users[i].address.address"
  - "users[i].address.city"
  - "users[i].address.zip"
  - "users[i].address.unit"
  - "users[i].address.state"
  - "users[i].address.country"
question: |
  % if i == 0 and al_person_answering == "user":
  What is your address?
  % else:
  What is ${ users[i] }'s address?
  % endif
fields:
  - label: "Where does ${ users[i] } live?"
    field: users[i].address
    datatype: object_radio
    choices:
      - users[0].address if defined("users[0].address.address") else None
    object labeler: "lambda y: y.on_one_line()"
    none of the above: Somewhere else
    disable others: True
    show if:
      code: |
        i > 0 and defined("users[0].address.address")
  - code: |
      users[i].address_fields(country_code=AL_DEFAULT_COUNTRY, default_state=AL_DEFAULT_STATE, required={'zip': True})
---
id: notarize now
question: |
  Is a notary with you right now?
subquestion: |
  % if notarized_letter_required:
  Because ${ children[0].name.first } goes to school in ${ children[0].school_district }, you need a notary. If a notary is not with you right now, choose **No** and then "print and sign later" on the next screen.
  % else:
  A notary is not required, but we recommend having one.
  % endif

  - Choose **Yes** if a notary is with you now. You will sign on this screen, then hand the device to the notary to complete their part.
  - Choose **No** if a notary is not with you now. You can sign on this screen now, or print the form and sign it later in front of a notary.

  **Important:** if you sign on this screen now without a notary present, the form cannot be notarized later.
fields:
  - no label: notarize_now
    datatype: yesnoradio
---
id: notary handoff
continue button field: notary_handoff
question: |
  Please hand this device to the notary
subquestion: |
  The next screens are for the notary. They will enter their name, the county, today's date, and their commission expiration date, and then sign.

  ${ users } signed this form on ${ signature_date.format() }.
---
id: Notary Information
question: |
  Notary: enter your information
subquestion: |
  This will be printed in the notary certificate on the form. ${ users } appeared before you.
fields:

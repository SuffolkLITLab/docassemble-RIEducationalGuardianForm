#################### School district logic #####################
comment: |
  Districts that require a notarized permission letter from the parent before
  a non-parent can register a child. Verified so far:
    Providence - https://www.providenceschools.org/registration/registration/registration-requirements
  Every other district falls back to the general notary recommendation on the
  intro screen. Add a district to this list once its rules are confirmed.
code: |
  districts_requiring_notarized_letter = ["Providence"]
---
code: |

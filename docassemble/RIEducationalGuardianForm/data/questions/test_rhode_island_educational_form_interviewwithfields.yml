id: Test rhode island educational form interview with fields intro
continue button field: test_rhode_island_educational_form_interviewwithfields_intro
question: <span class="text-primary">Please read the following important information before you fill out this form.</span> 
subquestion: |
  ## You can use this form if

  - Your child goes to school in Rhode Island
  - You are the parent or legal guardian of a child in a school in Rhode Island

  ## What this form does

    This form lets a trusted adult (a {caregiver}) get your child's school records. The caregiver can also make school decisions for your child if you are unavailable.

  A parent might become unavailable because of an illness, an arrest, or something else unexpected. This form helps make sure your child has an educational plan if that happens.

  This does not make the caregiver your child's {legal guardian}.
---
id: what you need
continue button field: what_you_need_screen
question: <span class="text-primary">Please read the following important information before you fill out this form.</span>
subquestion: |
  ## Before you start

  Have this information ready:

  - Caregiver's full name and address
  - Each child's full name
  - Each child's date of birth
  - Each child's school district

  ## Signing this form

  A {notary} is not required for most school districts, but we recommend having the form notarized. 
  
  A notarized form may be easier for a school to accept and can help confirm that the signature is yours.

  Need a notary? You may be able to find one for free at:

  - Your public library
  - Your bank
  - United Way's 2-1-1 helpline
---
id: eligibility check
question: |
  Please confirm that the following information is true to continue:
subquestion: |
  Click to confirm. 
fields:
  - "I confirm that my child or children go to school in Rhode Island": child_in_ri_school
    datatype: yesnowide
  - "I confirm that I am the parent or legal guardian of a child in a school in Rhode Island": is_parent_or_guardian
    datatype: yesnowide
---
id: not eligible
event: not_eligible_exit
question: |
  This form is not for you
subquestion: |
  This form only works for a child who goes to school in Rhode Island. You must be the child's parent or legal guardian. 

  If you left a box unchecked a box by mistake, click **Undo** to go back.
buttons:
  - Exit: exit
---
terms:
  green words: |
    Tap any green word to see what it means.
  notary: |
    A notary (notary public) is a person licensed by the state to witness signatures. Many banks and public libraries have one, often for free.
  caregiver: |
    The trusted adult you are choosing to make school decisions for your child when you are not available.
  legal guardian: |
    A person a court has given the legal right to make decisions for a child. Only a court can make someone a legal guardian. This form does not do that.
---
id: welcome screen
question: |
  ${ interview_short_title }
subquestion: |
  This tool helps you fill out Rhode Island's Educational Guardian form in 3 steps:

  Step 1. Write or select your answers to the following questions.<br>
  Step 2. Preview before printing.<br>
  Step 3. Download and print the final form. 

  This site is not a lawyer. If you would like a lawyer, find [your local legal aid provider](https://www.lsc.gov/what-legal-aid/find-legal-aid).

    <span class="fs-5">**Click any underlined word, like {caregiver}, for its meaning.**</span>
fields:
  - note: |
      ${ display_template(al_terms_of_use, scrollable=True) }
      
      <div class="fs-5 fw-bold">To continue, you must accept our terms of use.</div>
  - I accept the terms of use: acknowledged_information_use
    datatype: yesnowide
    grid: 8
validation code: |
  if not acknowledged_information_use:
    validation_error("You must accept the terms of use to continue.")
continue button field: al_intro_screen
---
id: how many parents
question: How many parents or legal guardians will sign this form?
subquestion: The form has room for one or two parents or legal guardians.
fields:
  - no label: users.target_number
    datatype: radio
    choices:
      - 1
      - 2
---
id: caregiver address
sets:
  - "caregivers[i].address.address"
  - "caregivers[i].address.city"
  - "caregivers[i].address.zip"
  - "caregivers[i].address.unit"
  - "caregivers[i].address.state"
  - "caregivers[i].address.country"
question: "What is the caregiver's address?"
fields:
  - code: |
      caregivers[i].address_fields(country_code=AL_DEFAULT_COUNTRY, default_state=AL_DEFAULT_STATE, required={'zip': True})
---
id: user address
sets:
  - "users[i].address.address"
  - "users[i].address.city"
  - "users[i].address.zip"
  - "users[i].address.unit"
  - "users[i].address.state"
  - "users[i].address.country"
question: |
  % if i == 0 and al_person_answering == "user":
  What is your address?
  % else:
  What is ${ users[i] }'s address?
  % endif
fields:
  - label: "Where does ${ users[i] } live?"
    field: users[i].address
    datatype: object_radio
    choices:
      - users[0].address if defined("users[0].address.address") else None
    object labeler: "lambda y: y.on_one_line()"
    none of the above: Somewhere else
    disable others: True
    show if:
      code: |
        i > 0 and defined("users[0].address.address")
  - code: |
      users[i].address_fields(country_code=AL_DEFAULT_COUNTRY, default_state=AL_DEFAULT_STATE, required={'zip': True})
---
id: notarize now
question: |
  Signing your form
subquestion: |
  **You do not need a notary to sign this form.** Only Providence schools ask for a notarized letter.

  <div class="alert alert-warning">
  <strong>We strongly recommend using a notary, because:</strong>
  <ul class="mb-0">
  <li><strong>It proves who you are.</strong> A notary checks your ID to make sure you are the person signing.</li>
  <li><strong>It makes your signature more trustworthy.</strong> It helps schools, courts, and other organizations trust that the right person signed.</li>
  </ul>
  </div>

  A notary cannot sign on this screen. If you want a notary, you will print the form and sign it in front of them.
fields:
  - "Do you want to use a notary to sign this form?": notary_option
    datatype: radio
    choices:
      - "Sign without a notary": no_notary
      - "Print the form and sign it in front of a notary": print_for_notary
---
comment: |

id: Test rhode island educational form interview with fields intro
continue button field: test_rhode_island_educational_form_interviewwithfields_intro
question: Authorization for Appointment of Educational Guardian
subquestion: |
  This form lets a parent or guardian name a trusted adult (i.e., a caregiver) who can get your child's school records and make school decisions if you are ever unavailable.
  
  ### You can use this form if
  
  - You are the parent or legal guardian of a child in school, and
  - The child lives in Rhode Island.
  
  ### You will need
  
  - The full name and address of the caregiver you are choosing
  - Each child's full name and date of birth
  
  It is estimated to take less than 10 minutes. The form is legally effective once signed. We strongly recommend having it notarized if you can. You will be asked about notarization near the end.
---
id: how many parents
question: How many parents or guardians will sign this form?
subquestion: The form has room for one or two parents/guardians.
fields:
  - Number of parents/guardians: users.target_number
    datatype: radio
    choices:
      - 1
      - 2
---
id: caregiver address
sets:
  - "caregivers[i].address.address"
  - "caregivers[i].address.city"
  - "caregivers[i].address.zip"
  - "caregivers[i].address.unit"
  - "caregivers[i].address.state"
  - "caregivers[i].address.country"
question: "What is the caregiver's address?"
fields:
  - code: |
      caregivers[i].address_fields(country_code=AL_DEFAULT_COUNTRY, default_state=AL_DEFAULT_STATE, required={'zip': True})
---
id: user address
sets:
  - "users[i].address.address"
  - "users[i].address.city"
  - "users[i].address.zip"
  - "users[i].address.unit"
  - "users[i].address.state"
  - "users[i].address.country"
question: |
  % if i == 0 and al_person_answering == "user":
  What is your address?
  % else:
  What is ${ users[i] }'s address?
  % endif
fields:
  - label: "Where does ${ users[i] } live?"
    field: users[i].address
    datatype: object_radio
    choices:
      - users[0].address if defined("users[0].address.address") else None
    object labeler: "lambda y: y.on_one_line()"
    none of the above: Somewhere else
    disable others: True
    show if:
      code: |
        i > 0 and defined("users[0].address.address")
  - code: |
      users[i].address_fields(country_code=AL_DEFAULT_COUNTRY, default_state=AL_DEFAULT_STATE, required={'zip': True})
---
id: Notary Information
question: |
  Notary Information
subquestion: |
  Please provide details about the notarization.
fields:
  - "County where notarization occurred": notarized_county
  - "Month of notarization": notarized_month
  - "Year of notarization": notarized_year
  - "Day of notarization": notarized_day
  - "Expiration date of notary commission": notary_commission_expires_date
    datatype: date
---
comment: |
  The questions below are copies of the questions in AssemblyLine's
  ql_baseline.yml, rewritten to name this interview's own objects instead of the
  generic `x`. Edit them freely: they replace the AssemblyLine versions. Delete
  one to go back to the AssemblyLine wording.
---
id: caregivers names
question: Who will be the caregiver?
subquestion: |
  The caregiver is the adult you are giving permission to make school decisions for your child while you are unavailable. They will be able to get your child's school records, talk to school staff about your child, and make decisions about which school, classroom, or program your child is in and what services they receive (for example, a classroom aide, a formal plan for any disability, etc.).
  
  Enter their full name.
fields:
  - code: |
      caregivers[i].name_fields()
sets:
  - "caregivers[i].name.first"
  - "caregivers[i].name.last"
  - "caregivers[i].name.middle"
  - "caregivers[i].name.suffix"
---
id: how many children
question: How many children are you listing on this form?
subquestion: You can list up to 4 children on this form.
fields:
  - Number of children: children.target_number
    datatype: radio
    choices:
      - 1
      - 2
      - 3
      - 4
---
id: children names
sets:
  - children[i].name.first
  - children[i].name.last
  - children[i].name.middle
  - children[i].name.suffix
question: |
  % if hasattr(children, 'ask_number') and children.ask_number and children.target_number == 1:
  What is your child's name?
  % else:
  What is the name of child ${ i + 1 } of ${ children.target_number }?
  % endif
fields:
  - code: |
      children[i].name_fields()
---
id: another child
question: |
  Is there another child to tell us about?
fields:
  - no label: children.there_is_another
    datatype: yesnoradio
---
id: notary names
sets:
  - notary[i].name.first
  - notary[i].name.last
  - notary[i].name.middle
  - notary[i].name.suffix
question: |
  % if hasattr(notary, 'ask_number') and notary.ask_number and notary.target_number == 1:
  Name of notary
  % else:
  Name of the ${ ordinal(i) } notary
  % endif
fields:
  - code: |
      notary[i].name_fields()
---
id: users names
sets:
  - users[i].name.first
  - users[i].name.last
  - users[i].name.middle
  - users[i].name.suffix
question: |
  % if i == 0 and al_person_answering == "user":
  What is your name?
  % else:
  What is the other parent or guardian's name?
  % endif
fields:
  - code: |
      users[i].name_fields()
---
id: another user
question: |
  % if al_form_type in ['starts_case', 'existing_case', 'appeal']:
  Is anyone else on your side of this case?
  % else:
  Is anyone else adding their name to this form with you?
  % endif
subquestion: |
  % if len(users.elements) > 1:
  So far you have told us about ${ comma_and_list(users.complete_elements()) }.
  % endif
fields:
  - no label: users.there_is_another
    datatype: yesnoradio
---
id: preview test_rhode_island_educational_form_interviewwithfields
question: |

id: notarized letter notice
continue button field: notarized_letter_notice
question: |
  ${ children[0].name.first }'s school is in ${ children[0].school_district }
subquestion: |
  Providence schools have a rule. If someone other than a parent or legal guardian signs a child up for school, they **must** show a letter from the parent or legal guardian. The letter **must** be signed in front of a notary.

  This form gives the caregiver permission to make school decisions for ${ children[0].name.first }. To be safe, **sign it in front of a notary**.

  At the end, choose "print and sign later." Then take the printed form to a notary and sign it there. **If a notary is with you right now, you can sign on the screen instead.**
---
id: caregivers names
question: Who will be the caregiver?
subquestion: |
  The caregiver is the adult you are giving permission to make school decisions for your child while you are unavailable.

  The caregiver will be able to:

  - Get your child's school records, including special education, counseling, and medical records
  - Talk to school staff about your child
  - Make decisions about your child's school, classroom, or program
  - Make decisions about services your child gets at school, including special education

  This stays in effect until you cancel it in writing or your child turns 18.
fields:

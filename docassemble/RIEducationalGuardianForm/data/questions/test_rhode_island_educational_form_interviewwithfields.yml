  - "Date of notarization": notarized_date
    datatype: date
  - "Your commission expiration date": notary_commission_expires_date
    datatype: date
---
code: |
  # The form prints "On this ___ day of ___, 20__", so one date is split three ways.
  notarized_month = notarized_date.format("MMMM")
  notarized_day = notarized_date.format("d")
  notarized_year = notarized_date.format("yy")
---
id: notary signature
question: |
  Notary: sign your name
signature: notary[0].signature
under: |
